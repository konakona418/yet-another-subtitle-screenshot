[project]
name = "yet-another-subtitle-screenshot"
version = "0.1.0"
description = "Extract movie stills with subtitles burned in, and assemble them into contact sheets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11.0.0",
]

[project.scripts]
yass = "yass.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yass"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Prefer the system interpreter: its tkinter links against a Tk built with Xft,
# which renders antialiased text. uv-managed CPython builds ship a no-xft Tk.
python-preference = "system"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
